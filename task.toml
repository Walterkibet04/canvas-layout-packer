[task]
name = "afterquery/canvas-layout-packer"

[metadata]
author_name = "Walter kibet"
author_email = "kibetwalter726@gmail.com"
difficulty_explanation = "The people who do this work in practice are layout and design-tooling engineers who build automatic page, poster and ad-creative composition, and floorplanning engineers in chip design (soft-module floorplanning). Each block's aspect ratio is pinned to within 0.01 percent, so its size is a single free scale, but the area floors are only 88 to 97 percent of the hidden rectangle areas while the coverage threshold is 0.999. The floors alone sum to roughly 91 to 95 percent of the canvas, so placing every block at its minimum size, which is how a standard perfect-rectangle-packing search with fixed piece sizes works, leaves far too much uncovered and cannot pass. Blocks must grow by different amounts and the scales must be solved jointly so that every edge lines up: each block's width and height are linear in its scale, so a correct arrangement imposes a linear system on the scales, and a wrong arrangement either has no solution or pushes some block below its floor. The hidden tilings are recursive dissections that mix straight cuts with 5-piece pinwheels, and every graded tiling is verified to be non-guillotine, so no layout built purely from recursive straight cuts (a slicing-tree search over shape sets) can reproduce it; an earlier version used skyline-generated tilings that turned out to be always guillotine-cuttable, and a slicing-tree solver passed them in minutes. The blocks and their ids are shuffled, and each block's area floor is drawn independently with no category label, so neither the order, the ids nor the floors reveal the hidden rectangle areas beyond a loose bound. A greedy or maximal-rectangles packer with growth passes is very unlikely to close the layout to 0.999, and a fixed-size corner-fill search has no way to pick sizes (I confirmed that a minimum-size corner-fill search returns no layout on sampled instances). The instances are synthetic: each is generated from a planted gap-free tiling and the constraints derived from it, which keeps solvability provable and the check mechanical, but real layouts have content-driven constraints that this generator does not model."
solution_explanation = "The reference treats each block's scale as an unknown, so its width, height and area follow from that one number, and it searches over arrangements while solving the scales as it goes. It fills the canvas bottom-up with a skyline, always filling the lowest open corner with an unplaced block, which works for any tiling because the lowest open corner is always some block's bottom-left corner. Whenever the search decides that two edges coincide (a block's right edge meets the end of its segment, two neighbouring segment tops merge, or a top reaches the ceiling) it adds a linear equation. The equations are kept as an orthogonal basis, so the current scale estimate, the smallest change from the nominal sizes that satisfies every equation so far, is updated cheaply and drives all later geometric decisions. Ambiguous merge and closure decisions are branched on. Pruning uses canvas bounds, per-block growth over the floor, the requirement that block areas sum to no more than the canvas, a subset-sum check that every skyline well and every leftover width can be filled by the blocks that remain, and a numeric failure memo (heuristic, not exact). When every block is placed and every segment closed, the equations hold exactly and the layout is validated against the real constraints. The aspect targets are rounded to six decimals, so each tile is shrunk by at most 0.004 units to absorb the rounding residual. Measured on this task's generator at 1000 by 1000 (pinwheel_prob 0.6, non-guillotine tilings of 15 blocks): about one seed in three solved within 20 seconds, and the graded seeds were chosen among those that solve in under 3 seconds. Through the harness the graded seeds took only a few seconds against 60 and 120 second limits. The reference is not reliable above about 17 blocks: only 3 of 17 seeds at 17 to 20 blocks solved in 20 seconds. Every instance has a full-coverage layout by construction."
verification_explanation = "Every check is geometric or arithmetic on the submitted placement list and the instance's own declared constraints: every block id present exactly once, each rectangle fully inside the canvas, each block's width/height ratio within its declared aspect band and its area at or above its minimum, no pairwise overlap, and total covered area (the sum of block areas, valid because overlap is separately disallowed) divided by canvas area at or above the instance's coverage threshold. Coordinates and sizes must be finite numbers: NaN, infinity, booleans and strings are rejected, and the solver's stdout is parsed with NaN and Infinity constants refused, because NaN makes every ordering comparison false and would otherwise bypass the bounds, overlap and aspect checks. Empty, partial or malformed output fails, so doing nothing scores 0. Feasibility is guaranteed by construction: each instance starts as a real gap-free tiling of the canvas and every block's constraints are derived from its planted rectangle, so the planted tiling always satisfies them and proves full coverage is achievable independent of any solver; the agent never sees it and any valid layout of its own earns credit. The harness also tests the verifier itself: it must reject an overlapping layout, an aspect-ratio violation, a low-coverage layout, non-finite or non-numeric coordinates and an all-NaN layout, and accept the planted tiling. The submission is run once per instance as the unprivileged nobody user, in its own session, with a minimal environment and the no_new_privs flag set, so a setuid binary or file capability shipped inside /app cannot regain root (I confirmed a root-owned setuid copy of Python reports euid 65534 under the harness and euid 0 without the flag). The verifier also strips setuid and setgid bits and file capabilities from /app before running, and after each instance kills every process whose real, effective, saved or filesystem uid is nobody and everything left in the solver's session. The reward directory /logs/verifier is root-owned with mode 700 and the tests are not readable by the submission, so submitted code cannot write or replace the reward or read the tests; the reward is written by the root-run test.sh only after pytest exits and leftover submission processes are killed."
category = "Media"
subcategory = "Automated Layout"
tags = ["layout", "rectangle-packing", "combinatorial-optimization", "page-design", "np-hard"]
expert_time_estimate_hours = 6
relevant_experience = "Software engineer with 5 years of experience."

